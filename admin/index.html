<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal — CTF BOX ARENA</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>

<body class="auth-page-body">
    <div class="arena-bg"></div>

    <div class="page-layout">
        <header class="admin-top-nav">
            <div class="nav-brand">
                <span class="brand-m">M</span>
                <span class="brand-dot">.</span>
                <span class="brand-title">CTF BOX</span>
                <span class="brand-arena-badge">ADMIN CONSOLE</span>
            </div>
            <div class="nav-status">
                <span class="status-dot live"></span>
                <span class="nav-status-text">CONTROL NODE ONLINE</span>
            </div>
        </header>

        <main class="auth-main-container">
            <div class="auth-box-card">
                <div class="auth-card-header">
                    <div class="admin-shield-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <circle cx="12" cy="11" r="3"></circle>
                            <path d="M12 14v4"></path>
                        </svg>
                    </div>
                    <h1 class="auth-title" id="auth-title">ADMINISTRATOR AUTHENTICATION</h1>
                    <p class="auth-subtitle" id="auth-subtitle">Sign in to oversee live telemetry, participants, and scoring.</p>
                </div>

                <div id="auth-alert" class="admin-alert hidden"></div>

                <!-- LOGIN FORM -->
                <form id="admin-login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-username">ADMINISTRATOR USERNAME / ID</label>
                        <div class="input-wrap">
                            <input type="text" id="login-username" placeholder="admin" required autofocus autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="login-password">PASSWORD</label>
                        <div class="input-wrap">
                            <input type="password" id="login-password" placeholder="••••••••••••" required autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn-admin-primary" id="btn-login-submit">
                        <span>ACCESS COMMAND CENTER</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14"></path>
                            <path d="m12 5 7 7-7 7"></path>
                        </svg>
                    </button>
                </form>

                <div class="auth-footer-note">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span>Restricted Portal. All administrator actions & telemetry logs are cryptographically tracked.</span>
                </div>
            </div>
        </main>
    </div>

    <script src="/admin/js/admin-auth.js"></script>
</body>

</html>
